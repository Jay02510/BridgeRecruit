<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>BridgeRecruit</title>
  <!-- Office.js must be loaded from the CDN, not bundled -->
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 12px; font-size: 14px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    #status { color: #666; }
    button { padding: 8px 14px; font-size: 14px; cursor: pointer; }
    #dev-bypass { margin-top: 12px; padding: 8px; border: 1px dashed #d97706; border-radius: 4px; background: #fffbeb; }
    #dev-bypass label { display: block; font-size: 11px; color: #92400e; margin-bottom: 4px; }
    #dev-token-input { width: 100%; box-sizing: border-box; font-size: 12px; padding: 4px; margin-bottom: 6px; }
    #school-card { margin-top: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; display: none; }
    #school-card h2 { font-size: 16px; margin: 0 0 4px; }
    #school-card .meta { color: #666; font-size: 12px; margin-bottom: 8px; }
    #school-card ul { margin: 8px 0 0; padding-left: 18px; }
    #school-card li { margin-bottom: 6px; }
    #quick-actions { display: none; margin-top: 12px; }
    #quick-actions button { margin-right: 6px; margin-bottom: 6px; }
    #action-panel { margin-top: 10px; padding: 10px; border: 1px solid #eee; border-radius: 6px; }
    #action-panel label { display: block; font-size: 12px; margin-bottom: 8px; }
    #action-panel input, #action-panel textarea, #action-panel select { width: 100%; box-sizing: border-box; margin-top: 4px; }
    #quick-create-form label { display: block; font-size: 12px; margin-bottom: 8px; }
    #quick-create-form input, #quick-create-form select { width: 100%; box-sizing: border-box; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="app-body" style="display: none;">
    <h1>BridgeRecruit</h1>
    <div id="status">Loading…</div>
    <div id="sender-domain"></div>
    <button id="signin-btn" style="display: none;">Sign in</button>
    <div id="dev-bypass" style="display: none;">
      <label for="dev-token-input">DEV ONLY: paste token from dashboard, skip sign-in dialog</label>
      <input type="text" id="dev-token-input" placeholder="Bearer token" />
      <button id="dev-token-btn">Use token</button>
    </div>
    <div id="school-card"></div>
    <div id="quick-actions"></div>
  </div>
</body>
</html>
